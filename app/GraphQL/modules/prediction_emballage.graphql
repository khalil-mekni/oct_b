type RecommandationAction {
  date_suggeree: String!
  date_livraison: String
  quantite: Float!
  description: String!
}

type PredictionEmballage {
  periode: String!
  quantite_predite: Float!
  unite: String!
  prix_unitaire: Float!
  cout_predite: Float!
  stock_actuel: Float!
  stock_securite: Float!
  stock_restant_prevu: Float!
  quantite_recommandee: Float!
  cout_recommande: Float!
  alerte_rupture: Boolean!
  
  # Nouveaux champs pour la simulation dynamique
  consommation_restante_mois: Float
  receptions_futures_mois: Float
  recommandations_plan: [RecommandationAction!]
}

extend type Query {
  predictionEmballage(
    emballage_id: ID!
    entrepot_id: ID
    granularity: String
    periods: Int
    start_date: String
  ): [PredictionEmballage!]!
    @field(resolver: "App\\GraphQL\\Queries\\PredictionEmballageQuery")
}
type Facture {
  id: ID!
  numero_facture: String!
  date_facture: Date!
  
  # Champs ajoutés pour le module avancé
  montant_ht: Float!          # Brut
  montant_penalites: Float    # NOUVEAU
  montant_ht_net: Float       # NOUVEAU
  montant_ttc: Float!
  jours_retard_total: Int     # NOUVEAU
  
  statut: String!
  emballage: Emballage @belongsTo
  fournisseur: Fournisseur @belongsTo
  contrat: Contrat @belongsTo
  commande: Commande @belongsTo
  
  # Pour voir tous les BL liés à cette facture
  bon_livraisons: [BonLivraison!] @hasMany 
  
  valide_par: User @belongsTo
  created_at: DateTime!
  updated_at: DateTime!
}

input CreateFactureInput {
  numero_facture: String!
  date_facture: Date!
  bon_livraison_ids: [ID!]!
  statut: String
  montant_ht: Float
  emballage_id: ID
  fournisseur_id: ID
  contrat_id: ID
  montant_penalites: Float
  jours_retard_total: Int
}

input UpdateFactureInput {
  numero_facture: String
  date_facture: Date
  montant_ht: Float
  montant_penalites: Float
  jours_retard_total: Int
  emballage_id: ID
  quantite_facturee: Float
  commande_id: ID
  statut: String
}

extend type Query {
  factures: [Facture!]!
    @paginate(model: "App\\Models\\Facture", defaultCount: 10)

  facture(id: ID! @eq): Facture
    @find(model: "App\\Models\\Facture")
}

extend type Mutation {
  createFacture(input: CreateFactureInput!): Facture
    @field(resolver: "App\\GraphQL\\Mutations\\FactureMutator@create")

  updateFacture(id: ID!, input: UpdateFactureInput!): Facture
    @field(resolver: "App\\GraphQL\\Mutations\\FactureMutator@update")

  deleteFacture(id: ID!): Boolean!
    @field(resolver: "App\\GraphQL\\Mutations\\FactureMutator@delete")
}
enum StatutContrat {
  ACTIF
  EXPIRE
  SUSPENDU
}

type Contrat {
  id: ID!
  numero_contrat: String!
  objet: String
  date_signature: Date
  date_debut: Date!
  date_fin: Date!
  quantite_contractuelle: Float!
  taux_depassement_autorise: Float!
  quantite_realisee: Float
  montant_ht: Float
  montant_tva: Float
  taux_cautionnement: Float
  taux_penalite_retard: Float
  plafond_penalite: Float
  prix_unitaire: Float
  statut: StatutContrat!

  fournisseur_id: ID!
  emballage_id: ID!

  fournisseur: Fournisseur! @belongsTo
  emballage: Emballage! @belongsTo

  commandes: [Commande!]! @hasMany
  bonLivraisons: [BonLivraison!]! @hasMany
  
  commandes_count: Int @count(relation: "commandes")
  bon_livraisons_count: Int @count(relation: "bonLivraisons")

  created_at: DateTime
  updated_at: DateTime
}

input CreateContratInput {
  numero_contrat: String!
  objet: String
  date_signature: Date
  date_debut: Date!
  date_fin: Date!
  quantite_contractuelle: Float!
  taux_depassement_autorise: Float = 0.20
  quantite_realisee: Float = 0.0
  montant_ht: Float
  montant_tva: Float
  taux_cautionnement: Float
  taux_penalite_retard: Float
  plafond_penalite: Float
  prix_unitaire: Float
  statut: StatutContrat = ACTIF

  fournisseur_id: ID!
  emballage_id: ID!
}

input UpdateContratInput {
  numero_contrat: String
  objet: String
  date_signature: Date
  date_debut: Date
  date_fin: Date
  quantite_contractuelle: Float
  taux_depassement_autorise: Float
  quantite_realisee: Float
  montant_ht: Float
  montant_tva: Float
  taux_cautionnement: Float
  taux_penalite_retard: Float
  plafond_penalite: Float
  prix_unitaire: Float
  statut: StatutContrat

  fournisseur_id: ID
  emballage_id: ID
}

type Query {
  contrat(id: ID! @eq): Contrat @find
  contrats: [Contrat!]! @all
  refreshContratStatuts: [Contrat!]!
    @field(resolver: "App\\GraphQL\\Mutations\\ContratMutator@refreshStatuts")
}

type Mutation {
  createContrat(input: CreateContratInput! @spread): Contrat @create
  updateContrat(id: ID!, input: UpdateContratInput! @spread): Contrat @update
  deleteContrat(id: ID! @whereKey): Contrat @delete
}
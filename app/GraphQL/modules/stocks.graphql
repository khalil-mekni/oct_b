type Stock {
  id: ID!
  entrepot_id: ID!
  emballage_id: ID!
  lot_id: ID
  date_stock: DateTime!
  quantite_init: Float
  quantite: Float!
  sens: String!
  quantite_finale: Float
  user_id: ID

  entrepot: Entrepot @belongsTo
  emballage: Emballage @belongsTo
  lot: Lot @belongsTo
  user: User @belongsTo

  created_at: DateTime
  updated_at: DateTime
}

type EntrepotLot {
  id: ID!
  quantite: Float!
  entrepot: Entrepot! @belongsTo
  lot: Lot! @belongsTo
  emballage: Emballage! @belongsTo
  created_at: DateTime
  updated_at: DateTime
}

extend type Query {
  stockHistory(
    entrepot_id: ID
    emballage_id: ID
    lot_id: ID
    from: DateTime
    to: DateTime
  ): [Stock!]!
    @field(resolver: "App\\GraphQL\\Queries\\StockQuery@history")

  stockTheoriqueAt(
    entrepot_id: ID!
    emballage_id: ID!
    lot_id: ID
    at: DateTime!
  ): Float!
    @field(resolver: "App\\GraphQL\\Queries\\StockQuery@theoriqueAt")

  availableLotsByEntrepot(
    entrepot_id: ID!
    emballage_id: ID
  ): [EntrepotLot!]!
    @field(resolver: "App\\GraphQL\\Queries\\StockQuery@availableLotsByEntrepot")

  availableEntrepotsByLot(
    lot_id: ID!
  ): [EntrepotLot!]!
    @field(resolver: "App\\GraphQL\\Queries\\StockQuery@availableEntrepotsByLot")

  lotDisponibleDansEntrepot(
    entrepot_id: ID!
    lot_id: ID!
    emballage_id: ID!
  ): Float!
    @field(resolver: "App\\GraphQL\\Queries\\StockQuery@lotDisponibleDansEntrepot")
}


type StockArchiveDay {
  date: String!
  in: Float!
  out: Float!
  balance: Float!
}

type StockArchiveSummary {
  total_in: Float!
  total_out: Float!
  today_in: Float!
  today_out: Float!
  balance: Float!
  days: [StockArchiveDay!]!
}

extend type Query {
  stockArchiveSummary: StockArchiveSummary!
    @field(resolver: "App\\GraphQL\\Queries\\Dashboard\\StockArchiveSummary")
}
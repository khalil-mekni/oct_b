type User {
    id: ID!
    name: String!
    first_name: String
    last_name: String
    email: String!
    role: String!
    phone: String
    birth_date: Date
    address: String
    is_active: Boolean
    last_login_at: DateTime
}

extend type Query {
    users: [User!]!
        @all
        @guard(with: ["api"])

    user(id: ID!): User
        @find
        @guard(with: ["api"])
}
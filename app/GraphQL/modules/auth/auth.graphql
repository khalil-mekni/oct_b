type AuthPayload {
    token: String!
    user: User!
}

extend type Query {
    me: User
        @field(resolver: "App\\GraphQL\\Resolvers\\UserResolver@me")
        @guard(with: ["api"])
}

extend type Mutation {
    login(
        email: String!
        password: String!
    ): AuthPayload
        @field(resolver: "App\\GraphQL\\Mutations\\Auth\\AuthMutator@login")

    register(
        first_name: String!
        last_name: String!
        email: String!
        password: String!
        phone: String
        birth_date: String
        address: String
    ): AuthPayload
        @field(resolver: "App\\GraphQL\\Mutations\\Auth\\AuthMutator@register")

    resendVerificationEmail: String
        @field(resolver: "App\\GraphQL\\Mutations\\Auth\\AuthMutator@resendVerificationEmail")
        @auth(guard: "api")

    verifyEmail(token: String!): String!
        @field(resolver: "App\\GraphQL\\Mutations\\Auth\\AuthMutator@verifyEmail")

    logout: Boolean
        @field(resolver: "App\\GraphQL\\Mutations\\Auth\\AuthMutator@logout")
        @auth(guard: "api")

    forgotPassword(email: String!): String!
        @field(resolver: "App\\GraphQL\\Mutations\\Auth\\AuthMutator@forgotPassword")

    resetPassword(
        email: String!
        token: String!
        password: String!
        password_confirmation: String!
    ): String!
        @field(resolver: "App\\GraphQL\\Mutations\\Auth\\AuthMutator@resetPassword")
}
type Alert {
    id: ID!
    type: String!
    title: String!
    message: String!
    severity: String!
    status: String!
    entity_type: String
    entity_id: ID
    action_url: String
    is_active: Boolean!
    created_at: DateTime
    updated_at: DateTime
    read_at: DateTime
    archived_at: DateTime
}

extend type Query {
    alerts(
        status: String
        severity: String
        type: String
        is_active: Boolean
    ): [Alert!]!
        @field(resolver: "App\\GraphQL\\Queries\\AlertQuery@list")

    unreadAlertsCount: Int!
        @field(resolver: "App\\GraphQL\\Queries\\AlertQuery@unreadCount")
}

extend type Mutation {
    markAlertAsRead(id: ID!): Alert
        @field(resolver: "App\\GraphQL\\Mutations\\AlertMutation@markAsRead")

    markAllAlertsAsRead: Boolean!
        @field(resolver: "App\\GraphQL\\Mutations\\AlertMutation@markAllAsRead")

    archiveAlert(id: ID!): Alert
        @field(resolver: "App\\GraphQL\\Mutations\\AlertMutation@archive")
}